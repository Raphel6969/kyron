# Kyron Layer — Local Development Stack
# Usage: docker compose up --build
version: "3.9"

services:
  kyron:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8080:80"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DEMO_MODE=true
      - ALLOWED_ORIGINS=*
      - HOT_DATABASE_URL=sqlite:///./sentinel.db
      - JWT_ALGORITHM=HS256
      - FRONTEND_URL=http://localhost
      - POLICY_FILE_PATH=policy/policy.example.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
