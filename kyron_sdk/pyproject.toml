[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyron-security"
version = "0.1.0"
authors = [
  { name="Kyron Security Team", email="security@kyron.sec" },
]
description = "Runtime AI Security Firewall & Guardrails SDK for Autonomous Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
]
keywords = [
  "ai-security",
  "llm-guardrails",
  "prompt-injection",
  "agentic-ai",
  "runtime-firewall",
  "langchain",
  "crewai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/Raphel6969/kyron"
"Documentation" = "https://github.com/Raphel6969/kyron#readme"
"Repository" = "https://github.com/Raphel6969/kyron.git"
